# ===== Launcher =====
bindd = SUPER, Space, App launcher, exec, walker
bindd = SUPER, Escape, Power menu, exec, walker -m power
bind = SUPER, K, exec, alacritty -e btop

# ===== Screenshots =====
bind = , Print, exec, hyprshot -m output
bindd = SUPER SHIFT, S, Region, exec, hyprshot -m region
bindd = SUPER, Print, Color picker, exec, hyprpicker -a

# ===== Lock =====
bindd = SUPER CTRL, L, Lock screen, exec, hyprlock

# ===== Notifications =====
bindd = SUPER, comma, Dismiss notification, exec, makoctl dismiss
bindd = SUPER SHIFT, comma, Dismiss all, exec, makoctl dismiss -a

# ===== Clipboard =====
bindd = SUPER, C, Universal copy, sendshortcut, CTRL, Insert, activewindow
bindd = SUPER, V, Universal paste, sendshortcut, SHIFT, Insert, activewindow
bindd = SUPER, X, Universal cut, sendshortcut, CTRL, X, activewindow

# ===== Night light =====
bindd = SUPER CTRL, N, Toggle nightlight, exec, pkill -USR1 hyprsunset
