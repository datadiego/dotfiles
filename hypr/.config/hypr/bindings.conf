# ===== Application bindings =====
bindd = SUPER, Return, Terminal, exec, alacritty
bindd = SUPER SHIFT, Return, Browser, exec, firefox
bindd = SUPER SHIFT, F, File manager, exec, nautilus --new-window
bindd = SUPER SHIFT, N, Editor, exec, code
bindd = SUPER SHIFT, D, Docker, exec, alacritty -e lazydocker
bindd = SUPER SHIFT, B, Browser, exec, firefox
bindd = SUPER SHIFT, M, Music, exec, spotify

# ===== Window management =====
bindd = SUPER, W, Close window, killactive
bindd = SUPER, J, Toggle split, layoutmsg, togglesplit
bindd = SUPER, T, Toggle float, togglefloating
bindd = SUPER, F, Fullscreen, fullscreen, 0
bindd = SUPER CTRL, F, Fullscreen tile, fullscreenstate, 0 2
bindd = SUPER ALT, F, Full width, fullscreen, 1
bindd = SUPER, P, Pseudo window, pseudo
bindd = SUPER, S, Toggle scratchpad, togglespecialworkspace, scratchpad
bindd = SUPER ALT, S, Move to scratchpad, movetoworkspace, special:scratchpad
bindd = SUPER, O, Toggle floating/pin, exec, hyprctl dispatch togglefloating && hyprctl dispatch pin
bindd = SUPER, G, Toggle group, togglegroup
bindd = SUPER ALT, G, Move out of group, moveoutofgroup

# ===== Focus movement =====
bindd = SUPER, Left, Focus left, movefocus, l
bindd = SUPER, Right, Focus right, movefocus, r
bindd = SUPER, Up, Focus up, movefocus, u
bindd = SUPER, Down, Focus down, movefocus, d

# ===== Move windows =====
bindd = SUPER SHIFT, Left, Move left, movewindow, l
bindd = SUPER SHIFT, Right, Move right, movewindow, r
bindd = SUPER SHIFT, Up, Move up, movewindow, u
bindd = SUPER SHIFT, Down, Move down, movewindow, d

# ===== Swap windows =====
bindd = SUPER ALT, Left, Swap left, swapwindow, l
bindd = SUPER ALT, Right, Swap right, swapwindow, r
bindd = SUPER ALT, Up, Swap up, swapwindow, u
bindd = SUPER ALT, Down, Swap down, swapwindow, d

# ===== Workspaces =====
bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER, 6, Workspace 6, workspace, 6
bindd = SUPER, 7, Workspace 7, workspace, 7
bindd = SUPER, 8, Workspace 8, workspace, 8
bindd = SUPER, 9, Workspace 9, workspace, 9
bindd = SUPER, 0, Workspace 10, workspace, 10

bindd = SUPER SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move to workspace 10, movetoworkspace, 10

bindd = SUPER SHIFT ALT, 1, Move silent to 1, movetoworkspacesilent, 1
bindd = SUPER SHIFT ALT, 2, Move silent to 2, movetoworkspacesilent, 2
bindd = SUPER SHIFT ALT, 3, Move silent to 3, movetoworkspacesilent, 3
bindd = SUPER SHIFT ALT, 4, Move silent to 4, movetoworkspacesilent, 4
bindd = SUPER SHIFT ALT, 5, Move silent to 5, movetoworkspacesilent, 5
bindd = SUPER SHIFT ALT, 6, Move silent to 6, movetoworkspacesilent, 6
bindd = SUPER SHIFT ALT, 7, Move silent to 7, movetoworkspacesilent, 7
bindd = SUPER SHIFT ALT, 8, Move silent to 8, movetoworkspacesilent, 8
bindd = SUPER SHIFT ALT, 9, Move silent to 9, movetoworkspacesilent, 9
bindd = SUPER SHIFT ALT, 0, Move silent to 10, movetoworkspacesilent, 10

# ===== Workspace navigation =====
bindd = SUPER, Tab, Next workspace, workspace, e+1
bindd = SUPER SHIFT, Tab, Prev workspace, workspace, e-1
bindd = SUPER CTRL, Tab, Former workspace, workspace, previous

# ===== Move workspace between monitors =====
bindd = SUPER SHIFT ALT, Left, Move to left monitor, movecurrentworkspacetomonitor, l
bindd = SUPER SHIFT ALT, Right, Move to right monitor, movecurrentworkspacetomonitor, r

# ===== Cycle windows =====
bindd = ALT, Tab, Cycle next, cyclenext
bindd = ALT SHIFT, Tab, Cycle prev, cyclenext, prev
bindd = ALT, Tab, Bring to top, bringactivetotop

# ===== Cycle monitors =====
bindd = CTRL ALT, Tab, Next monitor, focusmonitor, +1
bindd = CTRL ALT SHIFT, Tab, Prev monitor, focusmonitor, -1

# ===== Resize =====
bindd = SUPER, minus, Shrink width, resizeactive, -100 0
bindd = SUPER, equal, Grow width, resizeactive, 100 0
bindd = SUPER SHIFT, minus, Shrink height, resizeactive, 0 -100
bindd = SUPER SHIFT, equal, Grow height, resizeactive, 0 100

# ===== Scroll workspaces =====
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Prev workspace, workspace, e-1

# ===== Mouse =====
bindm = SUPER, mouse:272, Move window
bindm = SUPER, mouse:273, Resize window

