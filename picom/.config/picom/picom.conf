backend = "xrender";
# Desactivar use-damage en VMs con software rendering (causa principal del problema)
use-damage = false;
vsync = true;
unredir-if-possible = false;

# Desactivar funciones innecesarias que pueden causar conflictos
shadow = false;
fading = false;

# Regla de opacidad alineada con la configuración de Alacritty (0.30 = 70% opacidad)
opacity-rule = [
  "100:class_g = 'Alacritty'"
]

